<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Barber Dueño - Barbería Terrassa</title>

<!-- PWA NEGRO PREMIUM + LOGO 1999 -->
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barber Dueño">
<link rel="apple-touch-icon" href="/icon-180-new.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192-new.png">
<link rel="manifest" href="/manifest-dueno.json">

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',sans-serif;background:#000;color:#fff; -webkit-tap-highlight-color: transparent;}
  .bebas{font-family:'Bebas Neue',sans-serif}
  .glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1)}
</style>
</head>
<body class="min-h-screen bg-black text-white antialiased">
<!-- HEADER NEGRO -->
<header class="sticky top-0 z-50 bg-black border-b border-zinc-800 px-5 py-4 flex items-center justify-between" style="padding-top: env(safe-area-inset-top);">
  <div class="flex items-center gap-3">
    <img src="/icon-192-new.png" class="w-10 h-10 rounded-xl bg-white object-contain p-1">
    <div>
      <h1 class="bebas text-[22px] leading-none tracking-widest">BARBERIA TERRASSA</h1>
      <p class="text-[10px] tracking-[0.3em] text-zinc-400 -mt-1">DUEÑO • SINCE 1999</p>
    </div>
  </div>
  <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_#22c55e]"></div>
</header>

<main class="p-5 pb-28 max-w-md mx-auto">
  <!-- STATS -->
  <div class="grid grid-cols-2 gap-3 mb-6">
    <div class="glass rounded-2xl p-4">
      <p class="text-[11px] text-zinc-400 uppercase tracking-widest">Hoy</p>
      <p class="bebas text-3xl" id="stat-hoy">0 cortes</p>
    </div>
    <div class="glass rounded-2xl p-4 bg-gradient-to-br from-zinc-900 to-black">
      <p class="text-[11px] text-zinc-400 uppercase tracking-widest">Por verificar</p>
      <p class="bebas text-3xl text-yellow-400" id="stat-pend">0</p>
    </div>
  </div>

  <!-- VERIFICACION NOCTURNA -->
  <div class="bg-white text-black rounded-[20px] p-5 mb-6">
    <h2 class="bebas text-2xl tracking-wide flex items-center gap-2">🌙 VERIFICACIÓN NOCHE</h2>
    <p class="text-[13px] text-zinc-600 mb-4">Marca quién vino hoy. Solo lo verificado suma puntos.</p>
    <div id="lista-reservas" class="space-y-3">
      <!-- Se llena con JS -->
    </div>
    <button onclick="verificarTodo()" class="w-full mt-5 bg-black text-white bebas text-xl tracking-widest py-3 rounded-xl">VERIFICAR SELECCIONADOS +20 PTS</button>
  </div>

  <!-- REGISTRO NFC -->
  <div class="glass rounded-[20px] p-5">
    <h3 class="bebas text-xl tracking-widest">📲 REGISTRO NFC CLIENTE</h3>
    <p class="text-xs text-zinc-400 mb-3">Cuando un cliente escanea la tarjeta NFC</p>
    <input id="nfc-nombre" placeholder="Tu nombre" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 mb-2 text-white outline-none">
    <input id="nfc-movil" placeholder="Tu móvil" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 mb-3 text-white outline-none">
    <button onclick="registrarNFC()" class="w-full bg-yellow-400 text-black font-black py-3 rounded-xl uppercase tracking-widest">Registrarme</button>
    <p id="nfc-msg" class="text-xs text-center mt-3 text-zinc-500"></p>
  </div>
</main>

<nav class="fixed bottom-0 left-0 right-0 bg-zinc-950 border-t border-zinc-800 flex justify-around py-3" style="padding-bottom: env(safe-area-inset-bottom);">
  <button class="flex flex-col items-center text-white"><span class="text-xl">◧</span><span class="text-[10px] tracking-widest mt-1">DUEÑO</span></button>
  <button onclick="location.href='/index.html'" class="flex flex-col items-center text-zinc-500"><span class="text-xl">◫</span><span class="text-[10px] tracking-widest mt-1">CLIENTE</span></button>
</nav>

<script>
// SISTEMA TIEMPO REAL
function loadReservas(){
  try{
    return JSON.parse(localStorage.getItem('barber_reservas') || '[{"id":1,"nombre":"Carlos R.","hora":"10:00","servicio":"Corte + Barba","verificado":false},{"id":2,"nombre":"Jose A.","hora":"11:30","servicio":"Corte","verificado":false},{"id":3,"nombre":"Marc S.","hora":"17:00","servicio":"Corte","verificado":false}]');
  }catch(e){return [];}
}
let reservas = loadReservas();
let lastCount = reservas.length;

function render(){
  reservas = loadReservas(); // siempre recarga lo ultimo
  const cont = document.getElementById('lista-reservas');
  cont.innerHTML = reservas.map(r=>`
    <label class="flex items-center gap-3 ${r.nuevo?'bg-yellow-100 animate-pulse':''} bg-zinc-100 rounded-xl p-3 cursor-pointer border ${r.nuevo?'border-yellow-400':''}">
      <input type="checkbox" data-id="${r.id}" ${r.verificado?'checked disabled':''} class="w-5 h-5 accent-black">
      <div class="flex-1">
        <p class="font-bold text-sm text-black">${r.hora} - ${r.nombre} ${r.verificado?'✓':''} ${r.nuevo?'<span class="bg-red-500 text-white text-[9px] px-1.5 py-0.5 rounded-full ml-1">NUEVO</span>':''}</p>
        <p class="text-[11px] text-zinc-500">${r.servicio} ${r.verificado?'(+20 pts dado)':''}</p>
      </div>
    </label>
  `).join('') || '<p class="text-sm text-zinc-500">No hay reservas hoy</p>';
  document.getElementById('stat-hoy').textContent = reservas.length + ' cortes';
  document.getElementById('stat-pend').textContent = reservas.filter(r=>!r.verificado).length;

  // Detecta nuevo registro
  if(reservas.length > lastCount){
    // Sonido + vibración
    try{ navigator.vibrate([200,100,200]); }catch(e){}
    try{ new Audio('data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVgAAACA...').play().catch(()=>{}); }catch(e){}
    // Notificación visual
    if(Notification && Notification.permission === "granted"){
      new Notification("¡Nuevo cliente!", {body: reservas[reservas.length-1].nombre + " se acaba de registrar por NFC", icon:"/icon-192-new.png"});
    }
  }
  lastCount = reservas.length;
}
function verificarTodo(){
  reservas = loadReservas();
  const checks = document.querySelectorAll('#lista-reservas input[type=checkbox]:not(:disabled)');
  let sum=0;
  checks.forEach(c=>{ if(c.checked){ const id=+c.dataset.id; const r=reservas.find(x=>x.id===id); if(r){r.verificado=true; r.nuevo=false; sum+=20;} } });
  localStorage.setItem('barber_reservas', JSON.stringify(reservas));
  render();
  if(sum>0) alert(`Verificados! +${sum} pts repartidos`);
  else alert('Selecciona al menos uno');
}
function registrarNFC(){
  const n=document.getElementById('nfc-nombre').value.trim();
  const m=document.getElementById('nfc-movil').value.trim();
  if(!n||!m) return document.getElementById('nfc-msg').textContent='Rellena nombre y móvil';
  reservas = loadReservas();
  const nueva = {id: Date.now(), nombre: n, hora: new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}), servicio: 'Registro NFC - '+m, verificado:false, nuevo:true};
  reservas.push(nueva);
  localStorage.setItem('barber_reservas', JSON.stringify(reservas));
  document.getElementById('nfc-msg').textContent='¡'+n+' registrado! Aparece arriba en tiempo real.';
  document.getElementById('nfc-nombre').value=''; document.getElementById('nfc-movil').value='';
  render();
}

// --- TIEMPO REAL: escucha cambios ---
window.addEventListener('storage', (e)=>{ if(e.key==='barber_reservas') render(); });

// Poll cada 2 segundos por si es la misma pestaña / otro dispositivo en misma red localStorage
setInterval(render, 2000);

// Pide permiso notificaciones
if("Notification" in window && Notification.permission !== "granted"){ Notification.requestPermission(); }

render();
</script>
</body>
</html>
