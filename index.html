<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>BarberBox</title><script src='https://cdn.tailwindcss.com'></script></head><body><div id='root'></div>
<script type='module'>
import React from "https://esm.sh/react@18.3.1";
import {createRoot} from "https://esm.sh/react-dom@18.3.1/client";
const {useState,useEffect}=React;
const KEYS={clients:"bb_clients",pending:"bb_pending",active:"bb_client_active_v2",active_old:"bb_client_active",pin:"bb_owner_pin"};
const getClients=()=>{try{return JSON.parse(localStorage.getItem(KEYS.clients)||"[]")}catch{return[]}};
const saveClients=(l)=>localStorage.setItem(KEYS.clients,JSON.stringify(l));
const getPending=()=>{try{return JSON.parse(localStorage.getItem(KEYS.pending)||"[]")}catch{return[]}};
const savePending=(l)=>localStorage.setItem(KEYS.pending,JSON.stringify(l));
const getActive=()=>{try{let r=localStorage.getItem(KEYS.active);if(r){let d=JSON.parse(r);if(d&&d.id)return d}let o=localStorage.getItem(KEYS.active_old);if(o){let p;try{p=JSON.parse(o)}catch{p=o}let id=typeof p==='string'?p.replace(/"/g,''):p?.id;if(id){let all=getClients();let f=all.find(c=>c.id===id);if(f){localStorage.setItem(KEYS.active,JSON.stringify(f));return f}return {id}} }}catch{}return null};
const setActive=(c)=>{localStorage.setItem(KEYS.active,JSON.stringify({id:c.id,name:c.name,mobile:c.mobile,points:c.points}));localStorage.removeItem(KEYS.active_old)};
const clearActive=()=>{localStorage.removeItem(KEYS.active);localStorage.removeItem(KEYS.active_old)};

function Client(){
 const [screen,setScreen]=useState("loading");const [client,setClient]=useState(null);const [name,setName]=useState("");const [mobile,setMobile]=useState("");const [msg,setMsg]=useState(null);
 useEffect(()=>{let a=getActive();let all=getClients();if(a){let f=all.find(c=>c.id===a.id);if(f){setClient(f);setActive(f);setScreen("wallet");return;}}setScreen("nfc")},[]);
 useEffect(()=>{if(!client)return;let id=setInterval(()=>{let all=getClients();let u=all.find(c=>c.id===client.id);if(u&&u.points!==client.points){setClient(u);setActive(u)}},2000);return()=>clearInterval(id)},[client]);
 const show=(t)=>{setMsg(t);setTimeout(()=>setMsg(null),3000)};
 const reg=(e)=>{e.preventDefault();if(!name.trim()||!mobile.trim()){show("Completa datos");return;}let all=getClients();let clean=s=>s.replace(/\s/g,"").replace(/\+/g,"");let ex=all.find(c=>clean(c.mobile)===clean(mobile));if(ex){setActive(ex);setClient(ex);setScreen("wallet");show("Bienvenido de nuevo, ya estabas registrado");return;}let nc={id:Date.now().toString(36),name:name.trim(),mobile:mobile.trim(),points:0,createdAt:Date.now()};saveClients([nc,...all]);setActive(nc);setClient(nc);setScreen("wallet");show("Registro guardado - No volveras a escribir tus datos");};
 const req=(type)=>{let map={sello:10,resena:20,canje:-200};let pend=getPending();if(pend.find(p=>p.clientId===client.id&&p.type===type&&Date.now()-p.createdAt<20000)){show("Solicitud ya enviada");return;}let r={id:Math.random().toString(36).slice(2,7),clientId:client.id,name:client.name,mobile:client.mobile,type,points:map[type],createdAt:Date.now()};savePending([r,...pend]);show("Solicitud enviada al barbero");};
 const redeem=()=>{let all=getClients().map(c=>c.id===client.id?{...c,points:c.points-200}:c);saveClients(all);let u=all.find(c=>c.id===client.id);setClient(u);setActive(u);show("50% OFF canjeado");};
 if(screen==="loading")return React.createElement("div",{className:"min-h-screen bg-black text-white/40 flex items-center justify-center"},"Cargando...");
 return React.createElement("div",{className:"min-h-screen bg-[#0A0A0A] text-white flex flex-col items-center p-5"},
  React.createElement("div",{className:"pt-6 font-bold text-[#D4AF37] tracking-[0.3em] text-[12px]"},"BARBERBOX"),
  screen==="nfc"&&React.createElement("div",{className:"flex-1 flex flex-col items-center justify-center text-center max-w-[380px] w-full"},
   React.createElement("div",{className:"text-[60px] mt-10"},"📲"),
   React.createElement("h1",{className:"text-[26px] font-extrabold mt-4"},"NFC DETECTADO"),
   React.createElement("p",{className:"text-white/50 text-[14px] mt-2"},"Registro unico - despues entras automatico"),
   getActive()&&React.createElement("button",{onClick:()=>{let a=getActive();let f=getClients().find(c=>c.id===a.id);if(f){setClient(f);setScreen("wallet")}},className:"mt-6 w-full h-[52px] bg-white text-black rounded-full font-bold"},"ENTRAR COMO "+(getActive()?.name||"CLIENTE")),
   React.createElement("button",{onClick:()=>setScreen("form"),className:"mt-4 w-full h-[52px] bg-[#D4AF37] text-black rounded-full font-bold"},"CONTINUAR")
  ),
  screen==="form"&&React.createElement("div",{className:"w-full max-w-[380px]"},
   React.createElement("button",{onClick:()=>setScreen("nfc"),className:"text-white/40 mb-6"},"← Volver"),
   React.createElement("h2",{className:"text-[22px] font-bold"},"Crea tu Wallet - Solo una vez"),
   React.createElement("form",{onSubmit:reg,className:"mt-6 flex flex-col gap-4"},
    React.createElement("input",{value:name,onChange:e=>setName(e.target.value),placeholder:"Nombre",className:"h-[52px] bg-[#1A1A1A] rounded-xl px-4"}),
    React.createElement("input",{value:mobile,onChange:e=>setMobile(e.target.value),placeholder:"Movil",className:"h-[52px] bg-[#1A1A1A] rounded-xl px-4"}),
    React.createElement("button",{type:"submit",className:"h-[52px] bg-[#D4AF37] text-black rounded-full font-bold"},"ENTRAR"),
    React.createElement("p",{className:"text-[11px] text-white/30 text-center"},"Si tu movil ya existe, entraras directo")
   )
  ),
  screen==="wallet"&&client&&React.createElement("div",{className:"w-full max-w-[380px] mt-6"},
   React.createElement("div",{className:"bg-[#1A1A1A] rounded-[24px] p-6 border "+(client.points>=200?"border-[#D4AF37]":"border-white/10")},
    client.points>=200&&React.createElement("div",{className:"text-center mb-4"},
     React.createElement("div",{className:"text-[#D4AF37] font-extrabold"},"¡50% OFF DESBLOQUEADO!"),
     React.createElement("button",{onClick:redeem,className:"mt-3 w-full h-[48px] bg-[#D4AF37] text-black rounded-full font-bold"},"CANJEAR 50% OFF")
    ),
    React.createElement("div",{className:"flex justify-between"},
     React.createElement("div",null,React.createElement("div",{className:"text-[11px] text-white/40"},"CLIENTE"),React.createElement("div",{className:"font-bold text-[18px]"},client.name),React.createElement("div",{className:"text-[12px] text-white/40"},client.mobile),React.createElement("div",{className:"mt-2 text-[10px] bg-[#D4AF37]/20 text-[#D4AF37] px-2 py-1 rounded-full inline-block"},"✓ GUARDADO - NO TENDRAS QUE REGISTRARTE MAS")),
     React.createElement("div",{className:"text-right"},React.createElement("div",{className:"text-[10px] text-[#D4AF37]"},"PUNTOS"),React.createElement("div",{className:"text-[36px] font-extrabold text-[#D4AF37]"},client.points))
    ),
    React.createElement("div",{className:"mt-4 h-[8px] bg-white/10 rounded-full overflow-hidden"},React.createElement("div",{className:"h-full bg-[#D4AF37]",style:{width:Math.min(100,client.points/200*100)+"%"}}))
   ),
   React.createElement("div",{className:"grid grid-cols-2 gap-3 mt-4"},
    React.createElement("button",{onClick:()=>req("sello"),className:"h-[60px] bg-[#1A1A1A] rounded-xl"},"SELLO +10"),
    React.createElement("button",{onClick:()=>req("resena"),className:"h-[60px] bg-[#1A1A1A] rounded-xl border border-[#D4AF37]/30"},"RESEÑA +20")
   ),
   React.createElement("button",{onClick:()=>{clearActive();setClient(null);setScreen("nfc")},className:"mt-6 text-[12px] text-white/30 underline mx-auto block"},"Cerrar sesion")
  ),
  msg&&React.createElement("div",{className:"fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#1A1A1A] border border-[#D4AF37]/30 px-5 py-3 rounded-full text-[13px]"},msg)
 );
}

function Owner(){
 const [pin,setPin]=useState("");const [auth,setAuth]=useState(localStorage.getItem(KEYS.pin)==="1989");const [clients,setClients]=useState(getClients());const [pending,setPending]=useState(getPending());const [msg,setMsg]=useState(null);
 useEffect(()=>{let id=setInterval(()=>{setClients(getClients());setPending(getPending())},2000);return()=>clearInterval(id)},[]);
 const login=(e)=>{e.preventDefault();if(pin==="1989"){localStorage.setItem(KEYS.pin,"1989");setAuth(true)}else{setMsg("PIN incorrecto");setTimeout(()=>setMsg(null),2000)}};
 const approve=(req)=>{let all=getClients();if(req.type==="canje"){all=all.map(c=>c.id===req.clientId?{...c,points:Math.max(0,c.points-200)}:c)}else{let ex=all.find(c=>c.id===req.clientId);if(ex)all=all.map(c=>c.id===req.clientId?{...c,points:c.points+req.points}:c);else all=[{id:req.clientId,name:req.name,mobile:req.mobile,points:req.points},...all]}saveClients(all);savePending(getPending().filter(p=>p.id!==req.id));setClients(all);setPending(getPending().filter(p=>p.id!==req.id))};
 const reject=(req)=>{savePending(getPending().filter(p=>p.id!==req.id));setPending(getPending().filter(p=>p.id!==req.id))};
 if(!auth)return React.createElement("div",{className:"min-h-screen bg-[#F5F3EF] flex flex-col items-center pt-20"},React.createElement("form",{onSubmit:login,className:"bg-white p-6 rounded-xl"},React.createElement("input",{value:pin,onChange:e=>setPin(e.target.value),placeholder:"PIN 1989",type:"password",className:"h-[52px] w-full bg-[#F5F3EF] rounded-xl px-4 text-center"}),React.createElement("button",{className:"mt-4 w-full h-[48px] bg-black text-white rounded-full"},"ENTRAR")),msg&&React.createElement("div",{className:"mt-4"},msg));
 return React.createElement("div",{className:"min-h-screen bg-[#F5F3EF] p-6"},
  React.createElement("div",{className:"max-w-[600px] mx-auto"},
   React.createElement("h1",{className:"font-bold text-[20px]"},"BARBERBOX DUEÑO - "+clients.length+" clientes"),
   React.createElement("div",{className:"mt-6"},pending.length===0?React.createElement("div",{className:"text-black/40"},"Sin solicitudes"):pending.map(p=>React.createElement("div",{key:p.id,className:"bg-white p-4 rounded-xl mb-3 flex justify-between"},React.createElement("div",null,p.name+" "+p.type+" "+p.points),React.createElement("div",{className:"flex gap-2"},React.createElement("button",{onClick:()=>reject(p),className:"px-3 h-8 bg-gray-100 rounded-full"},"No"),React.createElement("button",{onClick:()=>approve(p),className:"px-4 h-8 bg-black text-white rounded-full"},"Aprobar"))))),
   React.createElement("div",{className:"mt-8 bg-white rounded-xl divide-y"},clients.map(c=>React.createElement("div",{key:c.id,className:"p-4 flex justify-between"},React.createElement("div",null,c.name+" - "+c.mobile),React.createElement("div",{className:"font-bold"},c.points))))
  )
 );
}

function Root(){
 const [hash,setHash]=useState(window.location.hash);
 useEffect(()=>{let h=()=>setHash(window.location.hash);window.addEventListener("hashchange",h);return()=>window.removeEventListener("hashchange",h)},[]);
 return hash==="#owner"?React.createElement(Owner):React.createElement(Client);
}
createRoot(document.getElementById("root")).render(React.createElement(Root));
</script></body></html>
