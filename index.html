<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Barberbox | Cliente</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;overflow-x:hidden}
.header{padding:16px;border-bottom:1px solid #222;text-align:center}
.card{background:#151515;border:1px solid #222;border-radius:16px;padding:16px;margin:14px;max-width:480px;margin-left:auto;margin-right:auto}
input{width:100%;background:#0f0f0f;border:1px solid #2a2a2a;color:#fff;padding:14px;border-radius:10px;margin-bottom:10px;font-size:16px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;background:#f5c542;color:#000;cursor:pointer;font-size:15px}
.btn:disabled{opacity:0.5;pointer-events:none;background:#333;color:#888}
.btn-white{background:#fff;color:#000} .btn-white:disabled{background:#222;color:#555}
.progress{height:12px;background:#222;border-radius:10px;overflow:hidden;margin:10px 0} .progress-bar{height:100%;background:#f5c542;transition:width .3s}
.msg{padding:10px;border-radius:10px;margin:10px 0;text-align:center;font-size:13px;display:none} .msg.ok{display:block;background:#22c55e11;border:1px solid #22c55e55;color:#22c55e} .msg.warn{display:block;background:#f5c54211;border:1px solid #f5c54255;color:#f5c542} .msg.err{display:block;background:#ef444411;border:1px solid #ef444455;color:#ef4444}
.small-hint{color:#888;font-size:11px;text-align:center;margin-top:6px}
</style></head><body>
<div class="header"><b>💈 BARBERBOX</b><br><small style="color:#888">200 puntos = 50% OFF · 1 por semana mínimo</small></div>
<div id="not-registered" class="card" style="display:none">
<h3 style="color:#f5c542;margin:0 0 8px">¡Bienvenido! NFC escaneado</h3>
<p style="color:#888;font-size:13px;margin:0 0 12px">Regístrate una vez. Se queda guardado. Luego NFC entra directo a puntos.</p>
<input id="c-name" placeholder="Tu nombre"><input id="c-mobile" placeholder="Tu móvil">
<button id="btn-reg" class="btn">REGISTRARME</button>
<div id="reg-msg" class="msg"></div>
</div>
<div id="registered" class="card" style="display:none">
<h3 id="c-hello"></h3>
<div style="text-align:center;margin:16px 0">
<div style="font-size:64px;font-weight:900"><span id="c-points">0</span></div>
<div style="color:#888;font-size:13px">/ 200 puntos para 50% OFF</div>
<div class="progress"><div id="c-progress" class="progress-bar" style="width:0%"></div></div>
<div id="c-reward" style="display:none;background:#22c55e11;border:1px solid #22c55e55;color:#22c55e;padding:12px;border-radius:12px;margin-top:10px;font-weight:800">¡50% OFF disponible!</div>
</div>
<p id="c-last" style="color:#666;font-size:11px;text-align:center"></p>
<div id="status-msg" class="msg"></div>
<button id="btn-corte" class="btn" style="margin-bottom:10px">✂️ HE VENIDO A CORTARME (+10 PTS)</button>
<div id="corte-hint" class="small-hint"></div>
<button id="btn-resena" class="btn btn-white" style="margin-top:6px">⭐ DEJÉ RESEÑA EN GOOGLE (+20 PTS)</button>
<div id="resena-hint" class="small-hint"></div>
<p style="color:#666;font-size:11px;text-align:center;margin-top:10px">Queda ENVIADO y bloqueado 7 días. Solo 1 por semana.</p>
<button onclick="resetLocal()" style="background:none;border:0;color:#444;font-size:11px;margin-top:14px;width:100%">Cambiar móvil</button>
</div>
<script>
const SUPABASE_URL="https://sxpczzosxyuishwrwytv.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4cGN6em9zeHl1aXNod3J3eXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTMyOTcsImV4cCI6MjEwNjAyOTI5N30.X9dFdEsLwem85GpdYEMkeGItPFtkrfyWG3uHXwfgfJI";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
function showMsg(id,text,type){const el=document.getElementById(id);el.className='msg '+type;el.innerText=text;el.style.display='block';if(type!=='err')setTimeout(()=>{el.style.display='none';},6000);}
async function load(){
  const mob=localStorage.getItem('barberbox_mobile');
  const nam=localStorage.getItem('barberbox_name');
  if(!mob){document.getElementById('not-registered').style.display='block';document.getElementById('registered').style.display='none';return;}
  document.getElementById('not-registered').style.display='none';
  document.getElementById('registered').style.display='block';
  document.getElementById('c-hello').innerText=nam?'Hola, '+nam:'Hola';
  try{
    const {data,error}=await sb.from('clients').select('*').eq('mobile',mob).maybeSingle();
    if(error)throw error;
    if(data){
      const pct=Math.min(100,Math.round((data.points/200)*100));
      document.getElementById('c-hello').innerText='Hola, '+data.name;
      document.getElementById('c-points').innerText=data.points;
      document.getElementById('c-progress').style.width=pct+'%';
      document.getElementById('c-last').innerText='Última visita: '+new Date(data.last_visit).toLocaleString('es-ES');
      document.getElementById('c-reward').style.display=data.points>=200?'block':'none';
      localStorage.setItem('barberbox_name',data.name);
    }
    await actualizarLimites();
  }catch(e){showMsg('status-msg','Error: '+e.message,'err');}
}
async function actualizarLimites(){
  const mobile=localStorage.getItem('barberbox_mobile');
  if(!mobile)return;
  const oneWeekAgo=new Date(Date.now()-7*24*60*60*1000).toISOString();
  const lastCorteLocal=localStorage.getItem('barberbox_last_corte');
  const lastResenaLocal=localStorage.getItem('barberbox_last_resena');
  let bloqueoCorteLocal=false, bloqueoResenaLocal=false;
  if(lastCorteLocal && (Date.now()-parseInt(lastCorteLocal)) < 7*24*60*60*1000) bloqueoCorteLocal=true;
  if(lastResenaLocal && (Date.now()-parseInt(lastResenaLocal)) < 7*24*60*60*1000) bloqueoResenaLocal=true;
  try{
    const {data:cortes}=await sb.from('pending_requests').select('*').eq('mobile',mobile).eq('type','corte 10pts').gte('created_at',oneWeekAgo).limit(1);
    const {data:resenas}=await sb.from('pending_requests').select('*').eq('mobile',mobile).eq('type','resena Google 20pts').gte('created_at',oneWeekAgo).limit(1);
    const btnCorte=document.getElementById('btn-corte');
    const btnResena=document.getElementById('btn-resena');
    if((cortes && cortes.length>0) || bloqueoCorteLocal){
      const fecha=cortes && cortes.length>0 ? new Date(cortes[0].created_at) : new Date(parseInt(lastCorteLocal));
      const disponible=new Date(fecha.getTime()+7*24*60*60*1000);
      btnCorte.disabled=true;
      btnCorte.innerText='✔️ ENVIADO (+10) - Bloqueado 7 días';
      document.getElementById('corte-hint').innerText='Enviado '+fecha.toLocaleDateString('es-ES')+' · Disponible '+disponible.toLocaleDateString('es-ES');
    }else{
      btnCorte.disabled=false;
      btnCorte.innerText='✂️ HE VENIDO A CORTARME (+10 PTS)';
      document.getElementById('corte-hint').innerText='Puedes solicitar 1 corte cada 7 días';
    }
    if((resenas && resenas.length>0) || bloqueoResenaLocal){
      const fecha=resenas && resenas.length>0 ? new Date(resenas[0].created_at) : new Date(parseInt(lastResenaLocal));
      const disponible=new Date(fecha.getTime()+7*24*60*60*1000);
      btnResena.disabled=true;
      btnResena.innerText='✔️ ENVIADO (+20) - Bloqueado 7 días';
      document.getElementById('resena-hint').innerText='Enviado '+fecha.toLocaleDateString('es-ES')+' · Disponible '+disponible.toLocaleDateString('es-ES');
    }else{
      btnResena.disabled=false;
      btnResena.innerText='⭐ DEJÉ RESEÑA EN GOOGLE (+20 PTS)';
      document.getElementById('resena-hint').innerText='Puedes solicitar 1 reseña cada 7 días';
    }
  }catch(e){
    console.log(e);
    if(bloqueoCorteLocal){document.getElementById('btn-corte').disabled=true;document.getElementById('btn-corte').innerText='✔️ ENVIADO - Bloqueado 7 días';}
    if(bloqueoResenaLocal){document.getElementById('btn-resena').disabled=true;document.getElementById('btn-resena').innerText='✔️ ENVIADO - Bloqueado 7 días';}
  }
}
async function registrar(){
  const name=document.getElementById('c-name').value.trim();
  const mobile=document.getElementById('c-mobile').value.trim();
  const btn=document.getElementById('btn-reg');
  if(!name||!mobile){showMsg('reg-msg','Falta nombre o móvil','err');return;}
  btn.disabled=true;const old=btn.innerText;btn.innerText='Registrando...';
  try{
    const {data:ex,error:e1}=await sb.from('clients').select('*').eq('mobile',mobile).maybeSingle();
    if(e1)throw e1;
    if(ex){localStorage.setItem('barberbox_mobile',mobile);localStorage.setItem('barberbox_name',ex.name);showMsg('reg-msg','¡Ya estabas registrado! Entrando...','ok');setTimeout(load,600);return;}
    const {error}=await sb.from('clients').insert({name,mobile,points:0});
    if(error)throw error;
    try{await sb.from('pending_requests').insert({mobile,name,type:'registro',status:'pendiente'});}catch(_){}
    localStorage.setItem('barberbox_mobile',mobile);
    localStorage.setItem('barberbox_name',name);
    showMsg('reg-msg','¡Registrado! Ahora entras directo con NFC','ok');
    setTimeout(load,600);
  }catch(err){showMsg('reg-msg','Error: '+err.message,'err');}finally{btn.disabled=false;btn.innerText=old;}
}
async function avisar(tipo, puntos){
  const mobile=localStorage.getItem('barberbox_mobile');
  const name=localStorage.getItem('barberbox_name')||'Cliente';
  if(!mobile){showMsg('status-msg','No hay móvil guardado','err');return;}
  const oneWeekAgo=new Date(Date.now()-7*24*60*60*1000).toISOString();
  const lastKey=tipo.includes('corte')?'barberbox_last_corte':'barberbox_last_resena';
  const lastLocal=localStorage.getItem(lastKey);
  if(lastLocal && (Date.now()-parseInt(lastLocal)) < 7*24*60*60*1000){
    const disponible=new Date(parseInt(lastLocal)+7*24*60*60*1000);
    showMsg('status-msg','Ya solicitaste '+tipo+' - Disponible el '+disponible.toLocaleDateString('es-ES'),'warn');
    await actualizarLimites();return;
  }
  try{
    const {data:recientes}=await sb.from('pending_requests').select('*').eq('mobile',mobile).eq('type',tipo).gte('created_at',oneWeekAgo).limit(1);
    if(recientes && recientes.length>0){
      const disponible=new Date(new Date(recientes[0].created_at).getTime()+7*24*60*60*1000);
      showMsg('status-msg','Ya solicitaste '+tipo+' - Disponible el '+disponible.toLocaleDateString('es-ES'),'warn');
      localStorage.setItem(lastKey, new Date(recientes[0].created_at).getTime().toString());
      await actualizarLimites();return;
    }
  }catch(e){console.log(e);}
  const btnId=tipo.includes('corte')?'btn-corte':'btn-resena';
  const btn=document.getElementById(btnId);
  btn.disabled=true;btn.innerText='Enviando...';
  try{
    const {error}=await sb.from('pending_requests').insert({mobile,name,type:tipo,status:'pendiente'});
    if(error)throw error;
    localStorage.setItem(lastKey, Date.now().toString());
    btn.innerText='✔️ ENVIADO (+'+puntos+') - Bloqueado 7 días';
    showMsg('status-msg','¡Enviado! Bloqueado 7 días hasta que el dueño lo acepte','ok');
    await actualizarLimites();
  }catch(err){showMsg('status-msg','Error: '+err.message,'err');btn.disabled=false;}
}
function avisarCorte(){return avisar('corte 10pts',10);}
function avisarResena(){return avisar('resena Google 20pts',20);}
function resetLocal(){if(confirm('¿Borrar móvil?')){localStorage.removeItem('barberbox_mobile');localStorage.removeItem('barberbox_name');localStorage.removeItem('barberbox_last_corte');localStorage.removeItem('barberbox_last_resena');location.reload();}}
document.getElementById('btn-reg').addEventListener('click',registrar);
document.getElementById('btn-corte').addEventListener('click',avisarCorte);
document.getElementById('btn-resena').addEventListener('click',avisarResena);
document.getElementById('c-mobile').addEventListener('keydown',e=>{if(e.key==='Enter')registrar();});
load();
</script></body></html>
